# ENDURANCE (LOCAL only): 5 steady users for 60 minutes, to see whether response times or errors
# creep up over time (memory leaks, connection pool exhaustion, growing tables).
profile=endurance
users=5
rampUp=60
duration=3600
thinkMs=1000
thinkDeviationMs=300
maxResponseMs=5000
stopErrorPct=10
stopP95Ms=5000
