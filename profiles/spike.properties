# SPIKE (LOCAL only): 2 steady users for 5 minutes; after 2 minutes, 28 more arrive within
# 5 seconds and stay for 1 minute, then leave. Shows how the system copes and recovers.
profile=spike
users=2
rampUp=2
duration=300
spikeUsers=28
spikeDelay=120
spikeRamp=5
spikeDuration=60
thinkMs=1000
thinkDeviationMs=300
maxResponseMs=5000
stopErrorPct=20
stopP95Ms=10000
