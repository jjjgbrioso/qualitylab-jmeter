# STRESS (LOCAL only): users climb steadily from 0 to 50 over 20 minutes, then hold for 5 minutes.
# The run stops itself early when the last 200 samples show more than 5% errors
# or a 95th percentile above 3 seconds: that point is the limit being looked for.
profile=stress
users=50
rampUp=1200
duration=1500
thinkMs=1000
thinkDeviationMs=300
maxResponseMs=5000
stopErrorPct=5
stopP95Ms=3000
